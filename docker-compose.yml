services:
  monbudget:
    build: .
    # Si 3000 est déjà pris (ex. `next dev` local) : HOST_PORT=3001 docker compose up -d
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - monbudget_data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-changez-moi-en-production-min-32-caracteres}
    restart: unless-stopped

volumes:
  monbudget_data:
